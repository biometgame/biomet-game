<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos Biomédicos - Inicio</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }

        h1 {
            color: #00e676;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        p.subtitle {
            color: #b0bec5;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .equipment-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 230, 118, 0.3);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .equipment-btn:hover {
            background: rgba(0, 230, 118, 0.2);
            border-color: #00e676;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.2);
        }

        .equipment-icon {
            font-size: 2rem;
        }

        /* Diseño adaptable para celulares */
        @media (max-width: 500px) {
            .equipment-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BIOMED-GAME 🩺</h1>
        <p class="subtitle">Selecciona un equipo para conocer su información y detalles</p>

        <div class="equipment-grid">
            <!-- Botón 1: Ventilador Pulmonar -->
            <button class="equipment-btn" onclick="abrirEquipo('Ventilador Pulmonar')">
                <span class="equipment-icon">🫁</span>
               Ventilador Pulmonar
            </button>

            <!-- Botón 2: Incubadora Neonatal -->
            <button class="equipment-btn" onclick="abrirEquipo('Incubadora Neonatal')">
                <span class="equipment-icon">👶</span>
                Incubadora Neonatal
            </button>

            <!-- Botón 3: Desfibrilador -->
            <button class="equipment-btn" onclick="abrirEquipo('Desfibrilador')">
                <span class="equipment-icon">❤️</span>
                Desfibrilador
            </button>
             <!-- Botón 4: equipo de organos -->
            <button class="equipment-btn" onclick="abrirEquipo('equipos de organos')">
                <span class="equipment-icon">👁️👂</span>
                equipo de organos
            </button>
     

            <!-- Botón 5: microscopio -->
            <button class="equipment-btn" onclick="abrirEquipo('moicroscopio')">
                <span class="equipment-icon">🔬</span>
                microscopio
            </button>
            
             <!-- Botón 6: bomba de infucion -->
            <button class="equipment-btn" onclick="abrirEquipo('bomba de infucion')">
                <span class="equipment-icon">💊</span>
               bomba de infucion
            </button>
        </div>
    </div>

    

    <script>
        function abrirEquipo(nombreEquipo) {
            // Por ahora, mostraremos un aviso indicando qué botón se presionó
            // En el siguiente paso aquí programaremos para que abra la interfaz con la foto y la info
            alert("Has seleccionado: " + nombreEquipo + ". ¡Pronto aquí abriremos su información y foto!");
        }
    </script>
</body>
</html>
